<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Item History decoder integration fixture</title>
</head>
<body>
  <!-- Minimal stand-in for decoder-tool.html's decoder markup: a static,
       always-present result layer that only script.js's innerHTML writes
       ever populate, plus the category tab item-history-guide-integration.js
       reads for getDecoderCategory(). -->
  <div class="search-tabs">
    <button class="search-tab active" data-cat="appliances">Appliances</button>
  </div>
  <input type="text" id="serial" value="TRD3481274">
  <div id="serialResults">
    <div id="serialSummaryLayer" class="sl-top-summary-layer serial-summary-layer hidden"></div>
  </div>

  <script>
    // Stands in for renderSerialSummaryLayer()/decodeSerial() in script.js:
    // it always reuses the same #serialSummaryLayer node and replaces its
    // innerHTML wholesale, exactly like the real decoder does, without
    // pulling in all of script.js's unrelated decoding logic.
    window.simulateDecoderRender = function (bodyHtml) {
      var layer = document.getElementById('serialSummaryLayer');
      layer.innerHTML = bodyHtml || '<div class="rs-primary-row">Result</div>';
      layer.classList.remove('hidden');
    };
    window.simulateDecoderClear = function () {
      var layer = document.getElementById('serialSummaryLayer');
      layer.innerHTML = '';
      layer.classList.add('hidden');
    };
  </script>
  <script src="/item-history-guide-matcher.js"></script>
  <script src="/item-history-guide-integration.js"></script>
</body>
</html>
