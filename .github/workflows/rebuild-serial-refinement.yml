name: Rebuild serial refinement bundle

on:
  push:
    branches:
      - fix/serial-model-refinement-v2

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild focused browser controller
        run: npm run build:browser
      - name: Run complete Node test suite
        run: npm test
      - name: Run production build
        run: npm run build
      - name: Remove one-time workflow and trigger
        shell: bash
        run: |
          rm -f .github/workflows/rebuild-serial-refinement.yml
          rm -f .serial-refinement-rebuild-trigger
      - name: Commit generated bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: regenerate serial refinement browser bundle"
          git push origin HEAD:fix/serial-model-refinement-v2
