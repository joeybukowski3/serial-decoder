name: Apply serial refinement race fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/serial-model-refinement-v2
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verify and apply race fix
        shell: bash
        run: |
          echo '486346e08a935b7d1da17a0e1bbb82838229bde1f1925a55836fbf8e88e7f6bb  .serial-refinement-race-fix.patch' | sha256sum --check
          git apply --check .serial-refinement-race-fix.patch
          git apply .serial-refinement-race-fix.patch
      - name: Install dependencies
        run: npm ci
      - name: Rebuild generated controller
        run: npm run build:browser
      - name: Run complete Node suite
        run: npm test
      - name: Commit traced race fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/browser/serial-refinement-controller.js serial-refinement-controller.js
          git commit -m 'fix: prevent loading status from overwriting refinement result'
      - name: Remove temporary patch
        shell: bash
        run: |
          git rm .serial-refinement-race-fix.patch
          git commit -m 'chore: remove serial refinement race patch'
      - name: Confirm generated output is clean
        shell: bash
        run: |
          npm run build:browser
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Push focused commits
        run: git push origin HEAD:fix/serial-model-refinement-v2
