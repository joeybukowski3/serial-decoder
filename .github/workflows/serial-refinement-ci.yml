name: Serial refinement CI

on:
  push:
    branches:
      - fix/serial-model-refinement-v2
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Confirm committed build output
        run: git diff --exit-code
      - name: Confirm repeat build is idempotent
        shell: bash
        run: |
          npm run build
          git diff --exit-code
      - name: Complete Node test suite
        run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install pinned Playwright test runner
        run: npm install --no-save @playwright/test@1.61.1
      - name: Install Playwright browsers used by the shared suite
        run: npx playwright install --with-deps chromium msedge
      - name: Rebuild focused browser controller
        run: npm run build:browser
      - name: Start static site
        shell: bash
        run: |
          log=/tmp/serial-refinement-http.log
          python3 -m http.server 3001 > "$log" 2>&1 &
          pid=$!
          echo "$pid" > /tmp/serial-refinement-http.pid

          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3001/index.html; then
              break
            fi

            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Static server died before becoming ready"
              cat "$log"
              exit 1
            fi

            if [ "$i" -eq 30 ]; then
              echo "Static server did not become ready"
              cat "$log"
              exit 1
            fi

            sleep 1
          done

          sleep 1

          if ! kill -0 "$pid" 2>/dev/null; then
            echo "Static server died after readiness check"
            cat "$log"
            exit 1
          fi

          if ! curl -sf -o /dev/null http://localhost:3001/index.html; then
            echo "Static server failed final readiness check"
            cat "$log"
            exit 1
          fi
      - name: Run decoder and refinement browser suites
        id: browser_tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run test:playwright -- --workers=1 --reporter=json --trace=retain-on-failure > playwright-results.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Print static server log on browser test failure
        if: steps.browser_tests.outputs.exit_code != '0'
        shell: bash
        run: cat /tmp/serial-refinement-http.log || true
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-refinement-playwright-report
          path: |
            playwright-results.json
            test-results
          retention-days: 14
      - name: Fail when browser tests failed
        if: steps.browser_tests.outputs.exit_code != '0'
        run: exit 1
