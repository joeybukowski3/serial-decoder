name: Serial refinement CI

on:
  push:
    branches:
      - fix/serial-model-refinement-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Confirm committed build output
        run: git diff --exit-code
      - name: Confirm repeat build is idempotent
        shell: bash
        run: |
          npm run build
          git diff --exit-code
      - name: Complete Node test suite
        run: npm test
