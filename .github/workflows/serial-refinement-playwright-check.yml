name: Finalize serial refinement branch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/serial-model-refinement-v2
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Assemble and verify source archive
        shell: bash
        run: |
          cat .serial-final-files/chunk* > /tmp/serial-final-files.b64
          base64 --decode /tmp/serial-final-files.b64 > /tmp/serial-final-files.tar.gz
          echo 'f297eb2483a6a6960879fe67bb908a04ccd16aa644b1a45b1bebd1e475f56f9f  /tmp/serial-final-files.tar.gz' | sha256sum --check
          tar -xzf /tmp/serial-final-files.tar.gz -C .
          git restore --source=HEAD -- .github/workflows/serial-refinement-ci.yml .github/workflows/serial-refinement-playwright-check.yml
      - name: Install dependencies
        run: npm ci
      - name: Build generated controller
        run: npm run build
      - name: Run complete Node suite
        run: npm test
      - name: Commit visibility correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/browser/serial-refinement-controller.js serial-refinement-controller.js tests/serial-refinement-ui.spec.js tests/playwright-verify.spec.js
          git commit -m 'fix: keep serial refinement status visible'
      - name: Commit grounded provider rate limit
        shell: bash
        run: |
          git add api/refine-serial-date.js tests/api/refine-serial-date.test.mjs
          git commit -m 'fix: rate limit grounded serial refinement'
      - name: Commit deterministic build scope
        shell: bash
        run: |
          git add package.json
          git commit -m 'chore: keep refinement builds deterministic'
      - name: Commit documentation
        shell: bash
        run: |
          git add docs/serial-refinement-v2.md
          git commit -m 'docs: finalize serial refinement documentation'
      - name: Remove temporary payload
        shell: bash
        run: |
          git rm -r .serial-final-files
          git commit -m 'chore: remove serial refinement finalization payload'
      - name: Prove production build is idempotent
        shell: bash
        run: |
          npm run build
          git diff --exit-code
          npm run build
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Push final commits
        run: git push origin HEAD:fix/serial-model-refinement-v2
