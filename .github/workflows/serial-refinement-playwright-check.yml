name: Serial refinement Playwright check

on:
  push:
    branches:
      - fix/serial-model-refinement-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Archive source checkout
        shell: bash
        run: tar --exclude=.git -czf /tmp/serial-refinement-source.tar.gz .
      - name: Upload source checkout
        uses: actions/upload-artifact@v4
        with:
          name: serial-refinement-source
          path: /tmp/serial-refinement-source.tar.gz
          retention-days: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@latest
      - name: Install Microsoft Edge
        run: npx playwright install --with-deps msedge
      - name: Start static site
        shell: bash
        run: |
          python3 -m http.server 3001 > /tmp/serial-refinement-http.log 2>&1 &
          echo $! > /tmp/serial-refinement-http.pid
          sleep 2
      - name: Run progressive refinement browser tests
        id: browser_tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx playwright test tests/serial-refinement-ui.spec.js --reporter=json > playwright-results.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-refinement-playwright-report
          path: playwright-results.json
      - name: Fail when browser tests failed
        if: steps.browser_tests.outputs.exit_code != '0'
        run: exit 1
