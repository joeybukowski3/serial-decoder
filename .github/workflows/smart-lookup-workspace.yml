name: Smart Lookup workspace

on:
  push:
    branches:
      - fix/smart-lookup-performance-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload focused workspace
        uses: actions/upload-artifact@v4
        with:
          name: smart-lookup-v2-workspace
          path: |
            package.json
            package-lock.json
            api
            lib
            data/model-age-db.json
            src
            scripts
            tests
            index.html
            smart-lookup.html
            smart-lookup-extras.js
            smart-lookup-normalizer.js
            smart-lookup-summary-render.js
            smart-lookup-upgrade-patch.js
            smart-lookup-bundle.js
            script.js
            lkq-engine.js
            decoder-data.js
            shared.css
            mobile-smart-lookup.css
          retention-days: 3
