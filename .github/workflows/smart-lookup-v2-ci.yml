name: Smart Lookup v2 CI

on:
  push:
    branches:
      - fix/smart-lookup-performance-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Re-run production build for deterministic output
        run: npm run build
      - name: Confirm committed build output
        run: git diff --exit-code
      - name: Complete Node test suite
        run: npm test
      - name: Smart Lookup unit tests
        run: npm run test:smart-unit
      - name: Smart Lookup API tests
        run: npm run test:smart-api
      - name: Smart Lookup benchmark tests
        run: npm run test:smart-benchmark

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Rebuild browser assets
        run: npm run build
      - name: Start static site
        shell: bash
        run: |
          python3 -m http.server 3001 > /tmp/smart-lookup-v2-http.log 2>&1 &
          echo $! > /tmp/smart-lookup-v2-http.pid
          sleep 2
      - name: Run Smart Lookup browser suite
        run: npm run test:smart-playwright -- --reporter=line
      - name: Run existing browser suites
        run: npm run test:playwright -- --reporter=line
