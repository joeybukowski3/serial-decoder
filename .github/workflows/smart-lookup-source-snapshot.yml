name: Smart Lookup source snapshot

on:
  push:
    branches:
      - fix/smart-lookup-performance-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create source snapshot
        shell: bash
        run: tar --exclude=.git --exclude=node_modules --exclude=serial-decoder-source.tgz -czf serial-decoder-source.tgz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: smart-lookup-v2-source-snapshot
          path: serial-decoder-source.tgz
          retention-days: 3
