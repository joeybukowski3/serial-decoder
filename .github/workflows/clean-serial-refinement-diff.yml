name: Clean serial refinement diff

on:
  push:
    branches:
      - fix/serial-model-refinement-v2

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Restore unrelated generated site files
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- '*.html' sitemap.xml
      - name: Install dependencies
        run: npm ci
      - name: Build focused controller and inject decoder pages
        run: |
          npm run build:browser
          npm run build:inject
      - name: Run complete Node test suite
        run: npm test
      - name: Validate production build
        run: npm run build
      - name: Restore unrelated generated output after build validation
        shell: bash
        run: |
          git checkout origin/main -- '*.html' sitemap.xml
          npm run build:inject
      - name: Remove one-time workflow and trigger
        shell: bash
        run: |
          rm -f .github/workflows/clean-serial-refinement-diff.yml
          rm -f .serial-refinement-clean-trigger
      - name: Commit clean surgical diff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: keep serial refinement diff surgical"
          git push origin HEAD:fix/serial-model-refinement-v2
