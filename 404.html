<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Decode My Item page not found recovery page with links to current tools and guides.">
  <title>Page Not Found | Decode My Item</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .not-found-main { min-width:0; max-width:100%; min-height:100vh; display:grid; place-items:center; padding:32px 20px; background:radial-gradient(circle at top,rgba(68,229,194,.08),transparent 38%),var(--navy); }
    .not-found-card { box-sizing:border-box; width:100%; max-width:680px; min-width:0; text-align:center; padding:clamp(32px,7vw,64px); background:var(--card-bg); border:1px solid var(--border); border-radius:24px; box-shadow:0 24px 64px rgba(0,0,0,.3); }
    .not-found-code { color:var(--teal); font:700 12px/1.3 'JetBrains Mono',monospace; letter-spacing:.16em; text-transform:uppercase; }
    .not-found-card h1 { margin:16px 0 12px; }
    .not-found-card p { max-width:500px; margin:0 auto 28px; }
    .not-found-links { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; text-align:left; }
    .not-found-links a { min-height:48px; display:flex; align-items:center; justify-content:center; padding:12px 16px; border:1px solid rgba(68,229,194,.26); border-radius:12px; color:var(--white); font-weight:600; }
    .not-found-links a:first-child { background:var(--teal); border-color:var(--teal); color:#00382d; }
    .not-found-links a:focus-visible, .logo:focus-visible { outline:3px solid var(--amber); outline-offset:4px; }
    @media (max-width:480px) { .not-found-links { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="logo" aria-label="Decode My Item home">
      <span class="material-symbols-outlined logo-icon" aria-hidden="true">qr_code_scanner</span>
      <span><span class="logo-text">Decode My <span>Item</span></span><span class="logo-sub">Decode - Research - Automate</span></span>
    </a>
  </nav>
  <main class="not-found-main" id="main-content">
    <section class="not-found-card" aria-labelledby="not-found-title">
      <p class="not-found-code">Error 404</p>
      <h1 id="not-found-title">We couldn’t find that page.</h1>
      <p>The address may be outdated, or the page may have moved. Use one of these current Decode My Item paths to continue.</p>
      <nav class="not-found-links" aria-label="404 recovery links">
        <a href="/">Home</a>
        <a href="/decoder-tool">Serial Number Decoder</a>
        <a href="/smart-lookup">Smart Lookup</a>
        <a href="/brands">Brands</a>
        <a href="/serial-number-location-guide">Serial Number Location Guide</a>
      </nav>
    </section>
  </main>
</body>
</html>
